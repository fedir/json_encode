name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Vet
        run: make vet

      - name: Unit tests
        run: make test

      - name: Functional tests
        run: make functional-test
