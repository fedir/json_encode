version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: json_encode
    main: .
    binary: json_encode
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Publish a Homebrew formula to a tap repo on each tagged release.
# Requires a github.com/fedir/homebrew-tap repository and a HOMEBREW_TAP_TOKEN
# secret with write access to it.
brews:
  - name: json_encode
    repository:
      owner: fedir
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/fedir/json_encode"
    description: "Turn any shell output into JSON, one pipe away."
    license: "GPL-3.0"
    test: |
      assert_match "json_encode", shell_output("#{bin}/json_encode -version")
